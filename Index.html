<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Kasir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ============================================================
   Stylesheet.html - Core Styles & Design System
   ============================================================ */

:root {
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Light Theme Variables */
  --bg-primary: #f8fafc;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f1f5f9;
  --border-color: #e2e8f0;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: #e0e7ff;
  
  --success: #10b981;
  --success-hover: #059669;
  --success-light: #d1fae5;
  
  --warning: #f59e0b;
  --warning-hover: #d97706;
  --warning-light: #fef3c7;
  
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --danger-light: #fee2e2;
  
  --info: #0ea5e9;
  --info-hover: #0284c7;
  --info-light: #e0f2fe;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  
  --radius-sm: 0.375rem;
  --radius-md: 0.75rem;
  --radius-lg: 1rem;
  --radius-xl: 1.5rem;
  
  --sidebar-width: 260px;
  --header-height: 70px;
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  /* Dark Theme Variables */
  --bg-primary: #0b0f19;
  --bg-secondary: #151f32;
  --bg-tertiary: #1e293b;
  --border-color: #334155;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  --primary: #818cf8;
  --primary-hover: #6366f1;
  --primary-light: rgba(99, 102, 241, 0.15);
  
  --success: #34d399;
  --success-hover: #10b981;
  --success-light: rgba(16, 185, 129, 0.15);
  
  --warning: #fbbf24;
  --warning-hover: #f59e0b;
  --warning-light: rgba(245, 158, 11, 0.15);
  
  --danger: #f87171;
  --danger-hover: #ef4444;
  --danger-light: rgba(239, 68, 68, 0.15);
  
  --info: #38bdf8;
  --info-hover: #0ea5e9;
  --info-light: rgba(14, 165, 233, 0.15);

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
}

/* ============================================================
   Reset & Base Styles
   ============================================================ */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-size: 0.925rem;
  line-height: 1.5;
  overflow-x: hidden;
  transition: background-color var(--transition-normal), color var(--transition-normal);
}

a {
  color: var(--primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}
a:hover {
  color: var(--primary-hover);
}

/* Custom Scrollbar */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-color);
  border-radius: var(--radius-sm);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* ============================================================
   Loading Screen
   ============================================================ */
#loading-screen {
  position: fixed;
  inset: 0;
  background-color: var(--bg-primary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#loading-screen.fade-out {
  opacity: 0;
  pointer-events: none;
  transform: scale(1.05);
  visibility: hidden;
}
.loading-logo {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, var(--primary), var(--info));
  color: #fff;
  font-size: 2.2rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  margin-bottom: 1.5rem;
  animation: pulse-glow 2s infinite ease-in-out;
}
.loading-text {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 1rem;
}
.loading-bar {
  width: 200px;
  height: 6px;
  background-color: var(--border-color);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  width: 30%;
  background: linear-gradient(90deg, var(--primary), var(--info));
  border-radius: var(--radius-sm);
  animation: loading-progress 1.5s infinite linear;
}
@keyframes pulse-glow {
  0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 20px 8px rgba(99, 102, 241, 0.2); }
}
@keyframes loading-progress {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(330%); }
}

/* ============================================================
   Toast & Modal Styling
   ============================================================ */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 10000;
  pointer-events: none;
}
.toast {
  background-color: var(--bg-secondary);
  border-left: 5px solid var(--primary);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xl);
  padding: 16px 20px;
  min-width: 300px;
  max-width: 450px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transform: translateX(120%);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  opacity: 0;
  pointer-events: auto;
}
.toast.show {
  transform: translateX(0);
  opacity: 1;
}
.toast-content {
  flex-grow: 1;
}
.toast-title {
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.toast-message {
  color: var(--text-secondary);
  font-size: 0.85rem;
}
.toast-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
}
.toast-close:hover {
  color: var(--text-primary);
}
.toast-success { border-left-color: var(--success); }
.toast-warning { border-left-color: var(--warning); }
.toast-danger { border-left-color: var(--danger); }
.toast-info { border-left-color: var(--info); }

/* ============================================================
   Main Layout Grid
   ============================================================ */
.app-container {
  display: flex;
  min-height: 100vh;
}

/* Sidebar Navigation */
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: fixed;
  left: 0;
  top: 0;
  z-index: 99;
  transition: background-color var(--transition-normal), border-color var(--transition-normal);
}
.sidebar-brand {
  height: var(--header-height);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
}
.sidebar-logo {
  width: 38px;
  height: 38px;
  background: linear-gradient(135deg, var(--primary), var(--info));
  color: #fff;
  font-size: 1.3rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-md);
}
.sidebar-title {
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--text-primary);
}
.sidebar-menu {
  flex-grow: 1;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.sidebar-item:hover, .sidebar-item.active {
  background-color: var(--primary-light);
  color: var(--primary);
}
.sidebar-item svg {
  width: 20px;
  height: 20px;
  stroke-width: 2px;
}
.sidebar-footer {
  padding: 16px;
  border-top: 1px solid var(--border-color);
}
.user-profile-small {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px;
  border-radius: var(--radius-md);
  background-color: var(--bg-primary);
}
.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  background-color: var(--primary-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  color: var(--primary);
}
.user-info-small {
  flex-grow: 1;
  min-width: 0;
}
.user-name-small {
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-role-small {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: capitalize;
}

/* Main Content Area */
.main-wrapper {
  margin-left: var(--sidebar-width);
  flex-grow: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header */
.main-header {
  height: var(--header-height);
  background-color: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 98;
  transition: background-color var(--transition-normal), border-color var(--transition-normal);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.page-title-text {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
}
.shift-status-pill {
  padding: 6px 12px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.shift-status-pill.open {
  background-color: var(--success-light);
  color: var(--success);
}
.shift-status-pill.closed {
  background-color: var(--danger-light);
  color: var(--danger);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header-action-btn {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background-color: var(--bg-secondary);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all var(--transition-fast);
}
.header-action-btn:hover {
  background-color: var(--bg-tertiary);
  color: var(--text-primary);
}
.header-action-btn svg {
  width: 20px;
  height: 20px;
}
.header-action-btn .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background-color: var(--danger);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 50px;
  border: 2px solid var(--bg-secondary);
}

/* Profile Dropdown & Notifications Dropdown */
.dropdown-menu {
  position: absolute;
  top: 100%;
  right: 0;
  margin-top: 8px;
  width: 320px;
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: all var(--transition-fast);
  z-index: 100;
}
.dropdown-menu.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}
.dropdown-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.dropdown-title {
  font-weight: 600;
  font-size: 0.95rem;
}
.dropdown-body {
  max-height: 350px;
  overflow-y: auto;
}
.dropdown-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border-color);
  text-align: center;
}

/* Notification Item */
.notif-item {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: background-color var(--transition-fast);
}
.notif-item:hover {
  background-color: var(--bg-tertiary);
}
.notif-item.unread {
  background-color: var(--primary-light);
}
.notif-icon-wrapper {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.notif-icon-wrapper.warning { background-color: var(--warning-light); color: var(--warning); }
.notif-icon-wrapper.danger { background-color: var(--danger-light); color: var(--danger); }
.notif-icon-wrapper.info { background-color: var(--info-light); color: var(--info); }
.notif-content {
  flex-grow: 1;
}
.notif-title {
  font-weight: 600;
  font-size: 0.85rem;
  margin-bottom: 2px;
}
.notif-msg {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.notif-time {
  font-size: 0.75rem;
  color: var(--text-muted);
}
.notif-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.notif-action-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px;
}
.notif-action-btn:hover {
  color: var(--danger);
}

/* Main Content Container */
.content-body {
  padding: 32px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   Grid & Card Layout Components
   ============================================================ */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-bottom: 32px;
}
.stat-card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  box-shadow: var(--shadow-sm);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.stat-icon {
  width: 54px;
  height: 54px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: var(--shadow-md);
}
.stat-icon.revenue { background: linear-gradient(135deg, #6366f1, #4f46e5); }
.stat-icon.transactions { background: linear-gradient(135deg, #10b981, #059669); }
.stat-icon.sold { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
.stat-icon.products { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
.stat-icon svg {
  width: 24px;
  height: 24px;
}
.stat-info {
  flex-grow: 1;
}
.stat-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-value {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text-primary);
}

/* Dashboard Charts Grid */
.charts-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.card {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  transition: background-color var(--transition-normal), border-color var(--transition-normal);
}
.card-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}
.card-body {
  padding: 24px;
  position: relative;
}

/* ============================================================
   Tables & Lists
   ============================================================ */
.table-responsive {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-md);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
.data-table th {
  background-color: var(--bg-tertiary);
  color: var(--text-secondary);
  font-weight: 600;
  padding: 14px 20px;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border-color);
}
.data-table td {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-color);
  color: var(--text-primary);
  font-size: 0.9rem;
}
.data-table tbody tr:hover {
  background-color: var(--bg-tertiary);
}
.data-table tbody tr:last-child td {
  border-bottom: none;
}

/* Pill / Badge */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 50px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-success { background-color: var(--success-light); color: var(--success); }
.badge-warning { background-color: var(--warning-light); color: var(--warning); }
.badge-danger { background-color: var(--danger-light); color: var(--danger); }
.badge-info { background-color: var(--info-light); color: var(--info); }
.badge-muted { background-color: var(--border-color); color: var(--text-secondary); }

/* List group style */
.list-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.list-group-item {
  padding: 12px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: var(--bg-secondary);
}

/* ============================================================
   Buttons & UI Inputs
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  font-size: 0.9rem;
  font-weight: 600;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.btn-primary { background-color: var(--primary); color: #fff; }
.btn-primary:hover { background-color: var(--primary-hover); }
.btn-success { background-color: var(--success); color: #fff; }
.btn-success:hover { background-color: var(--success-hover); }
.btn-danger { background-color: var(--danger); color: #fff; }
.btn-danger:hover { background-color: var(--danger-hover); }
.btn-warning { background-color: var(--warning); color: #fff; }
.btn-warning:hover { background-color: var(--warning-hover); }
.btn-secondary { background-color: var(--bg-tertiary); color: var(--text-primary); border-color: var(--border-color); }
.btn-secondary:hover { background-color: var(--border-color); }

.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
  border-radius: var(--radius-sm);
}

/* Form Controls */
.form-group {
  margin-bottom: 20px;
}
.form-label {
  display: block;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.form-control {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background-color: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 0.9rem;
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}
.form-control::placeholder {
  color: var(--text-muted);
}
.form-control:disabled {

<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-logo">K</div>
  <div class="loading-text">Memuat Aplikasi...</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="toast-container"></div>

<!-- App Root -->
<div id="app"></div>

<script>
// ============================================================
// JavaScript.html - Frontend Core Logic & Routing
// ============================================================

// App State
const App = {
  user: null,
  activeView: 'dashboard',
  products: [],
  categories: [],
  customers: [],
  settings: {},
  activeShift: null,
  notifications: [],
  cart: [],
  cartDiscount: 0,
  cartIncludeTax: true,
  selectedCustomerId: '',
  theme: 'light',
  
  // Charts instances
  charts: {},
  
  // Cache for quick lookups
  productCache: {}
};

// ============================================================
// Utility: Promise wrapper untuk google.script.run
// ============================================================
function api(fnName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      console.warn(`Simulating API call: ${fnName}`, args);
      // Fallback untuk local testing jika dijalankan di luar environment GAS
      return resolve(mockApi(fnName, ...args));
    }
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err => {
        console.error(`API Error on ${fnName}:`, err);
        Toast.danger(`Error: ${err.message || 'Terjadi kesalahan sistem.'}`);
        reject(err);
      })[fnName](...args);
  });
}

// Mock API untuk fallback local testing
function mockApi(fnName, ...args) {
  if (fnName === 'getInitialData') return { loggedIn: false };
  if (fnName === 'checkSession') return { loggedIn: false, user: null };
  if (fnName === 'getSettings') return { storeName: 'Toko Kasir Demo', taxRate: 10, currencySymbol: 'Rp', address: '', phone: '', receiptFooter: 'Terima kasih!' };
  if (fnName === 'getCategories') return [];
  if (fnName === 'getActiveShift') return null;
  if (fnName === 'getNotifications') return [];
  if (fnName === 'getDashboardData') return { todayRevenue: 0, todayTxCount: 0, todayItemsSold: 0, lowStock: [], recentTransactions: [], chartData: [], topProducts: [] };
  if (fnName === 'getProducts') return [];
  if (fnName === 'getCustomers') return [];
  if (fnName === 'getTransactions') return [];
  if (fnName === 'getShifts') return [];
  if (fnName === 'getUsers') return [];
  return { success: false, message: 'Menjalankan di luar Google Apps Script.' };
}

// ============================================================
// Toast Notification Helper
// ============================================================
const Toast = {
  container: null,
  
  init() {
    this.container = document.getElementById('toast-container');
  },
  
  show(title, message, type = 'info', duration = 4000) {
    if (!this.container) this.init();
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
      <div class="toast-content">
        <div class="toast-title">${title}</div>
        <div class="toast-message">${message}</div>
      </div>
      <button class="toast-close">&times;</button>
    `;
    
    // Close button event
    toast.querySelector('.toast-close').onclick = () => this.remove(toast);
    
    this.container.appendChild(toast);
    
    // Trigger reflow to start animation
    toast.offsetHeight;
    toast.classList.add('show');
    
    setTimeout(() => this.remove(toast), duration);
  },
  
  remove(toast) {
    toast.classList.remove('show');
    toast.addEventListener('transitionend', () => toast.remove());
  },
  
  success(msg, title = 'Berhasil') { this.show(title, msg, 'success'); },
  warning(msg, title = 'Peringatan') { this.show(title, msg, 'warning'); },
  danger(msg, title = 'Gagal') { this.show(title, msg, 'danger'); },
  info(msg, title = 'Info') { this.show(title, msg, 'info'); }
};

// ============================================================
// App Initializer & Auth Check
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  // === FAILSAFE: Paksa hide loading setelah 20 detik, apapun yang terjadi ===
  const loadingFailsafe = setTimeout(() => {
    console.warn('Loading failsafe triggered: hiding loading screen after timeout.');
    hideLoading();
    try { renderLoginPage(); } catch(fe) { console.error(fe); }
  }, 20000);

  try {
    Toast.init();
    
    // Load theme
    App.theme = localStorage.getItem('kasir_theme') || 'light';
    document.documentElement.setAttribute('data-theme', App.theme);
    
    // Fetch all initial data in one request to speed up loading
    const res = await api('getInitialData');
    if (res && res.loggedIn) {
      App.user = res.user;
      App.settings = res.settings || { storeName: 'Toko Kasir', taxRate: 10, currencySymbol: 'Rp', address: '', phone: '', receiptFooter: '' };
      App.categories = Array.isArray(res.categories) ? res.categories : [];
      App.activeShift = res.activeShift || null;
      App.notifications = Array.isArray(res.notifications) ? res.notifications : [];
      
      renderAppShell();
      navigateTo(App.activeView);
    } else {
      renderLoginPage();
    }
  } catch (e) {
    console.error('Initialization error:', e);
    // Fallback: tampilkan login page daripada layar putih
    try { renderLoginPage(); } catch(fe) { console.error(fe); }
  } finally {
    clearTimeout(loadingFailsafe);
    hideLoading();
  }
});

function showLoading() {
  const el = document.getElementById('loading-screen');
  if (el) {
    el.style.display = '';
    el.classList.remove('fade-out');
  }
}

function hideLoading() {
  const el = document.getElementById('loading-screen');
  if (el) {
    el.classList.add('fade-out');
    // Setelah animasi selesai, sembunyikan benar-benar
    setTimeout(() => { el.style.display = 'none'; }, 450);
  }
}

// Load metadata & global app config
// (Function ini tidak lagi dipanggil di awal karena sudah disatukan di getInitialData)
async function initAppData() {
  const [settings, categories, shift, notifs] = await Promise.all([
    api('getSettings'),
    api('getCategories'),
    api('getActiveShift'),
    api('getNotifications')
  ]);
  
  App.settings = settings || { storeName: 'Toko Kasir', taxRate: 10, currencySymbol: 'Rp', address: '', phone: '', receiptFooter: '' };
  App.categories = Array.isArray(categories) ? categories : [];
  App.activeShift = shift || null;
  App.notifications = Array.isArray(notifs) ? notifs : [];
}

// ============================================================
// Navigation & Views Router
// ============================================================
function navigateTo(view) {
  if (!App.user) return renderLoginPage();
  
  App.activeView = view;
  
  // Highlight active menu item
  document.querySelectorAll('.sidebar-item').forEach(el => {
    if (el.getAttribute('data-view') === view) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
  
  // Render page inside #content-area
  const contentArea = document.getElementById('content-area');
  if (!contentArea) return;
  
  // Update header page title
  const pageTitleMap = {
    dashboard: 'Dashboard Ringkasan',
    transaksi: 'Transaksi Kasir (POS)',
    riwayat: 'Riwayat Transaksi',
    produk: 'Manajemen Produk',
    kategori: 'Manajemen Kategori',
    customer: 'Pelanggan & Member',
    shift: 'Shift Kasir',
    laporan: 'Laporan Penjualan',
    settings: 'Pengaturan Toko & User'
  };
  document.getElementById('page-title-text').innerText = pageTitleMap[view] || 'Aplikasi Kasir';
  
  // Render proper view function
  if (view === 'dashboard') initDashboardView(contentArea);
  else if (view === 'transaksi') initTransaksiView(contentArea);
  else if (view === 'riwayat') initRiwayatView(contentArea);
  else if (view === 'produk') initProdukView(contentArea);

}

function updateNotifBadge() {
  const badge = document.getElementById('notif-badge-count');
  if (!badge) return;
  const unreadCount = App.notifications.filter(n => n.isRead === 'false' || n.isRead === false).length;
  if (unreadCount > 0) {
    badge.innerText = unreadCount;
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }
}

function renderNotifDropdownList() {
  const body = document.getElementById('notif-dropdown-body');
  if (!body) return;
  if (!App.notifications.length) {
    body.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--text-muted)">Tidak ada notifikasi</div>`;
    return;
  }

    <div class="notif-item ${n.isRead === 'false' || n.isRead === false ? 'unread' : ''}" onclick="markNotifAsRead('${n.id}')">

        </button>

async function markNotifAsRead(id) {
  await api('markNotifRead', id);
  const n = App.notifications.find(item => item.id === id);
  if (n) n.isRead = 'true';
  updateNotifBadge();
  renderNotifDropdownList();
}

async function markAllNotificationsRead(e) {
  e.stopPropagation();
  await api('markAllNotifsRead');
  App.notifications.forEach(n => n.isRead = 'true');
  updateNotifBadge();
  renderNotifDropdownList();
  Toast.success('Semua notifikasi ditandai dibaca.');
}

async function deleteNotification(e, id) {
  e.stopPropagation();
  await api('deleteNotif', id);
  App.notifications = App.notifications.filter(n => n.id !== id);
  updateNotifBadge();
  renderNotifDropdownList();
  Toast.success('Notifikasi berhasil dihapus.');
}

// ============================================================
// Formatter Utilities
// ============================================================
function fmtCurrency(val) {
  const sym = App.settings.currencySymbol || 'Rp';
  const num = Math.round(parseFloat(val) || 0);
  const formatted = num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return sym + ' ' + formatted;
}

function fmtDate(val) {
  if (!val) return '-';
  const d = new Date(val);
  return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatNumberWithDots(val) {
  const num = Math.round(parseFloat(val) || 0);
  if (!num) return '';
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatPriceInput(input) {
  let cursorPosition = input.selectionStart;
  let originalLength = input.value.length;
  
  // Hapus semua karakter non-angka
  let cleanValue = input.value.replace(/\D/g, "");
  if (cleanValue === "") {
    input.value = "";
    return;
  }
  
  // Format dengan pemisah ribuan titik
  let formatted = cleanValue.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  input.value = formatted;
  
  // Kembalikan kursor dengan penyesuaian panjang baru
  let newLength = formatted.length;
  cursorPosition = cursorPosition + (newLength - originalLength);
  input.setSelectionRange(cursorPosition, cursorPosition);
}

  document.getElementById('login-password').value = pass;

async function handleLoginSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;
  
  if (!email || !pass) return Toast.warning('Email dan password harus diisi.');
  
  showLoading();
  try {
    const res = await api('login', email, pass, remember);
    if (res.success) {
      App.user = res.user;
      await initAppData();
      renderAppShell();
      navigateTo('dashboard');
      Toast.success(`Selamat datang kembali, ${res.user.name}!`);
    } else {
      Toast.danger(res.message || 'Login gagal.');
    }
  } catch (err) {
    console.error(err);
  } finally {
    hideLoading();
  }
}

function openForgotPassModal() {
  document.getElementById('forgot-pass-modal').classList.add('show');
}
function closeForgotPassModal() {
  document.getElementById('forgot-pass-modal').classList.remove('show');
  document.getElementById('forgot-email').value = '';
  const resDiv = document.getElementById('forgot-result');
  resDiv.style.display = 'none';
}

async function handleForgotSubmit() {
  const email = document.getElementById('forgot-email').value.trim();
  if (!email) return Toast.warning('Masukkan email terdaftar.');
  
  const resDiv = document.getElementById('forgot-result');
  resDiv.style.display = 'none';
  
  try {
    const res = await api('forgotPassword', email);
    if (res.success) {
      resDiv.className = 'badge badge-success';
      resDiv.style.display = 'block';
      resDiv.innerText = `Halo ${res.name}, Password Anda adalah: ${res.password}`;
      Toast.success('Password berhasil ditemukan!');
    } else {
      resDiv.className = 'badge badge-danger';
      resDiv.style.display = 'block';
      resDiv.innerText = res.message;
    }
  } catch(e) {
    console.error(e);
  }
}

            x: {

              ticks: { color: 'var(--text-secondary)' }
            }
          }
        }
      });
    }
    
    // 5. Chart 2: Top Products - null-safe
    const topProductsEl = document.getElementById('top-products-chart');
    if (topProductsEl) {
      const ctxTop = topProductsEl.getContext('2d');
      if (App.charts.top) App.charts.top.destroy();
      if (data.topProducts.length) {
        App.charts.top = new Chart(ctxTop, {
          type: 'doughnut',
          data: {
            labels: data.topProducts.map(p => p.name),
            datasets: [{
              data: data.topProducts.map(p => p.qty),
              backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#ef4444', '#0ea5e9']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: 'var(--text-primary)', boxWidth: 12 }
              }
            }
          }
        });
      } else {
        ctxTop.canvas.parentNode.innerHTML = `<div style="color: var(--text-muted); text-align:center">Belum ada data penjualan</div>`;
      }
    }
    
    lucide.createIcons();
  } catch(e) {
    console.error('loadDashboardData error:', e);
    const statsContainer = document.getElementById('dash-stats');
    if (statsContainer) {
      statsContainer.innerHTML = `<div style="grid-column: span 4; text-align: center; padding: 40px; color: var(--danger)">
        <i data-lucide="alert-triangle" style="width:32px;height:32px;margin-bottom:12px"></i><br>
        <strong>Error memuat dashboard:</strong><br>${e.message || JSON.stringify(e)}
      </div>`;
      lucide.createIcons();
    }
  }
}

// Cetak struk ulang
async function reprintReceipt(txId) {
  showLoading();
  try {
    // Open window BEFORE await to prevent popup blocker
    const win = window.open('', '_blank', 'width=350,height=600');
    
    const tx = await api('getTransactionDetail', txId);
    if (!tx) {
      if (win) win.close();
      return Toast.danger('Gagal memuat struk.');
    }
    
    // Build output
    const receiptContent = buildReceiptHTML(tx);
    win.document.write('<html><head><title>Print Receipt</title>');
    win.document.write('<style>body { font-family: monospace; font-size: 12px; margin: 10px; } .receipt-header { text-align: center; } .receipt-divider { border-top: 1px dashed #000; margin: 8px 0; } .receipt-line { display: flex; justify-content: space-between; } .receipt-footer { text-align: center; margin-top: 15px; }</style>');
    win.document.write('</head><body>');
    win.document.write(receiptContent);
    win.document.write('</body></html>');
    win.document.close();
    win.focus();
    setTimeout(() => {
      win.print();
      win.close();
    }, 500);
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

function buildReceiptHTML(tx) {
  const store = App.settings.storeName || 'Toko Saya';
  const address = App.settings.address || 'Jl. Contoh No. 1';
  const phone = App.settings.phone || '021-xxxx';
  const footer = App.settings.receiptFooter || 'Terima kasih!';
  const itemsHTML = tx.items.map(i => `
    <div style="margin-bottom:6px">
      <div>${i.name}</div>
      <div style="display:flex; justify-content:space-between; padding-left:10px">
        <span>${i.qty} x ${fmtCurrency(i.price)}</span>
        <span>${fmtCurrency(i.qty * i.price)}</span>
      </div>
      ${i.discount > 0 ? `<div style="display:flex; justify-content:space-between; padding-left:10px; color:red"><span>Diskon</span><span>-${fmtCurrency(i.discount)}</span></div>` : ''}
    </div>
  `).join('');
  
  return `
    <div class="receipt-header">
      <div class="receipt-store-name" style="font-size: 16px; font-weight: bold">${store}</div>
      <div>${address}</div>
      <div>Telp: ${phone}</div>
    </div>
    <div class="receipt-divider"></div>
    <div class="receipt-line"><span>Invoice:</span><span>${tx.invoice}</span></div>
    <div class="receipt-line"><span>Tanggal:</span><span>${new Date(tx.createdAt).toLocaleDateString('id-ID') + ' ' + new Date(tx.createdAt).toLocaleTimeString('id-ID')}</span></div>
    <div class="receipt-line"><span>Kasir:</span><span>${tx.kasirName}</span></div>
    ${tx.customerName !== '-' ? `<div class="receipt-line"><span>Pelanggan:</span><span>${tx.customerName}</span></div>` : ''}
    <div class="receipt-divider"></div>
    <div class="receipt-items-list">
      ${itemsHTML}
    </div>
    <div class="receipt-divider"></div>
    <div class="receipt-line"><span>Subtotal:</span><span>${fmtCurrency(tx.subtotal)}</span></div>
    ${tx.discount > 0 ? `<div class="receipt-line"><span>Diskon Tx:</span><span>-${fmtCurrency(tx.discount)}</span></div>` : ''}
    <div class="receipt-line"><span>Pajak (10%):</span><span>${fmtCurrency(tx.tax)}</span></div>
    <div class="receipt-line" style="font-weight:bold"><span>TOTAL:</span><span>${fmtCurrency(tx.total)}</span></div>
    <div class="receipt-line"><span>Bayar (${tx.paymentMethod.toUpperCase()}):</span><span>${fmtCurrency(tx.cashPaid)}</span></div>
    <div class="receipt-line"><span>Kembalian:</span><span>${fmtCurrency(tx.change)}</span></div>
    <div class="receipt-divider"></div>
    <div class="receipt-footer">
      <div>${footer}</div>
      <div style="margin-top:5px; font-size:10px">Powered by AplikasiKasir</div>
    </div>
  `;
}

async function loadPosCatalog() {
  try {
    const products = await api('getProducts', { status: 'active' });
    activeProducts = products;
    
    // Cache products for fast ID lookups
    App.productCache = {};
    products.forEach(p => App.productCache[p.id] = p);
    
    renderCatalog();
  } catch(e) {
    console.error(e);
  }
}

function renderCatalog() {
  const container = document.getElementById('pos-product-catalog');
  if (!container) return;
  
  const searchVal = document.getElementById('pos-search-input').value.toLowerCase().trim();
  
  // Filter products by category and search query
  let filtered = activeProducts;
  if (currentCategoryFilter !== 'all') {
    filtered = filtered.filter(p => p.categoryId === currentCategoryFilter);
  }
  if (searchVal) {
    filtered = filtered.filter(p => 
      p.name.toLowerCase().includes(searchVal) || 
      p.sku.toLowerCase().includes(searchVal) || 
      String(p.barcode).toLowerCase().includes(searchVal)
    );
  }
  
  if (!filtered.length) {
    container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted)">Produk tidak ditemukan</div>`;
    return;
  }
  
  container.innerHTML = filtered.map(p => {
    const isOutOfStock = parseInt(p.stock) <= 0;
    const isLowStock = parseInt(p.stock) <= (App.settings.lowStockThreshold || 5);
    
    let badgeText = '';
    let badgeClass = '';
    if (isOutOfStock) {
      badgeText = 'Habis';
      badgeClass = 'low-stock';
    } else if (isLowStock) {
      badgeText = `Stok: ${p.stock}`;
      badgeClass = 'low-stock';
    }

// Keranjang / Cart Operations
function addToCart(prodId) {
  const prod = App.productCache[prodId];
  if (!prod) return;
  
  if (parseInt(prod.stock) <= 0) {
    Toast.danger('Produk habis, tidak bisa ditambahkan.');
    return;
  }
  
  const existing = App.cart.find(item => item.productId === prodId);
  if (existing) {
    if (existing.qty + 1 > parseInt(prod.stock)) {
      Toast.warning('Pembelian melebihi batas stok yang tersedia.');
      return;
    }
    existing.qty++;
  } else {
    App.cart.push({
      productId: prod.id,
      name: prod.name,
      price: parseFloat(prod.price),
      qty: 1,
      discount: 0,
      note: ''
    });
  }
  
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cart-items-body');
  if (!container) return;
  
  if (!App.cart.length) {
    container.innerHTML = `<div style="margin: auto; text-align:center; color: var(--text-muted)">Keranjang kosong</div>`;
    updateCartTotals();
    return;
  }
  
  container.innerHTML = App.cart.map((item, idx) => {
    const subtotal = (item.price * item.qty) - item.discount;
    return `
      <div class="cart-item">
        <div class="cart-item-details">
          <div class="cart-item-name" title="${item.name}">${item.name}</div>
          <div class="cart-item-meta">
            <span class="cart-item-price">${fmtCurrency(item.price)}</span>
            <span class="cart-item-subtotal">${fmtCurrency(subtotal)}</span>
          </div>
          <div class="cart-item-actions">
            <!-- Qty adjuster -->
            <div class="qty-btn" onclick="adjustQty(${idx}, -1)">-</div>
            <input type="text" class="qty-input" value="${item.qty}" readonly>
            <div class="qty-btn" onclick="adjustQty(${idx}, 1)">+</div>
            
            <span style="flex-grow:1"></span>
            
            <!-- Note / discount clicker -->
            <span class="cart-item-note-btn" onclick="openCartItemModal(${idx})">
              <i data-lucide="edit-3" style="width:14px; height:14px; vertical-align:middle;"></i> Settings
            </span>
            <button class="notif-action-btn" onclick="removeFromCart(${idx})" style="color:var(--danger)">
              <i data-lucide="trash-2" style="width:16px; height:16px;"></i>
            </button>
          </div>
          ${item.discount > 0 ? `<div style="font-size:0.75rem; color:var(--danger)">Diskon Item: -${fmtCurrency(item.discount)}</div>` : ''}
          ${item.note ? `<div style="font-size:0.75rem; color:var(--warning); font-style:italic">Note: ${item.note}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
  
  lucide.createIcons();
  updateCartTotals();
}

function adjustQty(idx, delta) {
  const item = App.cart[idx];
  const prod = App.productCache[item.productId];
  
  const newQty = item.qty + delta;
  if (newQty <= 0) {
    removeFromCart(idx);
    return;
  }
  
  if (newQty > parseInt(prod.stock)) {
    Toast.warning('Stok tidak mencukupi.');
    return;
  }
  
  item.qty = newQty;
  renderCart();
}

function removeFromCart(idx) {
  App.cart.splice(idx, 1);
  renderCart();
}

function clearCart() {
  if (App.cart.length && confirm('Kosongkan keranjang belanja?')) {
    App.cart = [];
    App.cartDiscount = 0;
    renderCart();
  }
}

function toggleCartTax(checked) {
  App.cartIncludeTax = checked;

function updateCartTotals() {
  const subtotal = App.cart.reduce((s, item) => s + (item.price * item.qty) - item.discount, 0);
  const taxRate = parseFloat(App.settings.taxRate) || 0;
  const tax = App.cartIncludeTax ? Math.round(subtotal * taxRate / 100) : 0;
  const total = subtotal - App.cartDiscount + tax;
  
  document.getElementById('cart-subtotal').innerText = fmtCurrency(subtotal);
  document.getElementById('cart-discount').innerText = `- ${fmtCurrency(App.cartDiscount)}`;
  document.getElementById('cart-tax').innerText = fmtCurrency(tax);
  document.getElementById('cart-total').innerText = fmtCurrency(total);
}

// Pembayaran & Numpad
let activePaymentMethod = 'tunai';
let cartTotalValue = 0;

function openCheckoutModal() {
  if (!App.cart.length) return Toast.warning('Keranjang belanja kosong.');
  
  const subtotal = App.cart.reduce((s, item) => s + (item.price * item.qty) - item.discount, 0);
  const taxRate = parseFloat(App.settings.taxRate) || 0;
  const tax = App.cartIncludeTax ? Math.round(subtotal * taxRate / 100) : 0;
  cartTotalValue = subtotal - App.cartDiscount + tax;
  
  document.getElementById('checkout-tagihan-val').innerText = fmtCurrency(cartTotalValue);
  document.getElementById('checkout-cash-paid').value = '';
  document.getElementById('checkout-change-val').innerText = fmtCurrency(0);
  document.getElementById('quick-cash-exact').innerText = `Pas: ${fmtCurrency(cartTotalValue)}`;
  
  selectPayMethod('tunai');
  document.getElementById('checkout-modal').classList.add('show');
}

function closeCheckoutModal() {
  document.getElementById('checkout-modal').classList.remove('show');
}

function selectPayMethod(method) {
  activePaymentMethod = method;
  document.querySelectorAll('.checkout-method-btn').forEach(btn => {
    if (btn.getAttribute('data-method') === method) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  
  // Non-tunai setup exact amount
  if (method !== 'tunai') {
    document.getElementById('checkout-cash-paid').value = formatNumberWithDots(cartTotalValue);
    document.getElementById('checkout-cash-paid').disabled = true;
  } else {
    document.getElementById('checkout-cash-paid').value = '';
    document.getElementById('checkout-cash-paid').disabled = false;
  }
  calculateChange();
}

function pressNum(val) {
  if (activePaymentMethod !== 'tunai') return;
  const input = document.getElementById('checkout-cash-paid');
  const clean = input.value.replace(/\D/g, '');
  
  if (val === 'C') {
    input.value = '';
  } else {
    input.value = formatNumberWithDots((clean + val).replace(/^0+/, ''));
  }
  calculateChange();
}

function setQuickCash(val) {
  if (activePaymentMethod !== 'tunai') return;
  const input = document.getElementById('checkout-cash-paid');
  const cashVal = val === 'exact' ? cartTotalValue : val;
  input.value = formatNumberWithDots(cashVal);
  calculateChange();
}

function calculateChange() {
  const cashVal = document.getElementById('checkout-cash-paid').value.replace(/\D/g, '');
  const cash = parseFloat(cashVal) || 0;
  const change = Math.max(0, cash - cartTotalValue);
  document.getElementById('checkout-change-val').innerText = fmtCurrency(change);
}

// Kirim data transaksi ke backend
async function submitTransaction() {
  const cashVal = document.getElementById('checkout-cash-paid').value.replace(/\D/g, '');
  const cashPaid = parseFloat(cashVal) || 0;
  
  if (cashPaid < cartTotalValue) {
    Toast.warning('Uang pembayaran kurang.');
    return;
  }
  
  showLoading();
  
  const txData = {
    items: App.cart,
    customerId: App.selectedCustomerId,
    discount: App.cartDiscount,
    includeTax: App.cartIncludeTax,
    paymentMethod: activePaymentMethod,
    cashPaid: cashPaid,
    shiftId: App.activeShift ? App.activeShift.id : ''
  };
  
  try {
    const res = await api('createTransaction', txData);
    if (res.success) {
      Toast.success('Transaksi berhasil diproses!');
      closeCheckoutModal();
      
      // Load updated notifications & stock
      await initAppData();
      updateNotifBadge();
      updateShiftStatusHeader();
      
      // Buka modal cetak struk otomatis
      viewReceiptModal(res.transaction.id);
    } else {
      Toast.danger(res.message || 'Gagal menyimpan transaksi.');
    }
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

function viewReceiptModal(txId) {
  // Tutup checkout modal & refresh cart
  App.cart = [];
  App.cartDiscount = 0;
  renderCart();
  loadPosCatalog(); // reload stocks
  
  viewTxDetail(txId);
}

function renderProductsTable() {

  if (!body) return;

  let filtered = allProductsList;
  
  if (searchVal) {

      p.name.toLowerCase().includes(searchVal) || 
      p.sku.toLowerCase().includes(searchVal) || 
      String(p.barcode).toLowerCase().includes(searchVal)

function openProductFormModal(id = null) {
  const form = document.getElementById('product-form');
  form.reset();
  document.getElementById('prod-id').value = '';
  document.getElementById('prod-photo').value = '';
  
  if (id) {
    document.getElementById('product-modal-title').innerText = 'Edit Produk';
    const p = allProductsList.find(item => item.id === id);
    if (p) {
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-name').value = p.name;
      document.getElementById('prod-categoryId').value = p.categoryId;
      document.getElementById('prod-sku').value = p.sku;
      document.getElementById('prod-barcode').value = p.barcode || '';
      document.getElementById('prod-price').value = formatNumberWithDots(p.price);
      document.getElementById('prod-stock').value = p.stock;
      document.getElementById('prod-photo').value = p.photo || '';
      document.getElementById('prod-status').value = p.status;
    }
  } else {
    document.getElementById('product-modal-title').innerText = 'Tambah Menu Baru';
    document.getElementById('prod-sku').value = 'MKN-' + Math.floor(100000 + Math.random() * 900000);

  document.getElementById('product-modal').classList.add('show');

function closeProductModal() {
  document.getElementById('product-modal').classList.remove('show');
}

async function handleProductFormSubmit(e) {
  e.preventDefault();
  
  const id = document.getElementById('prod-id').value;
  const name = document.getElementById('prod-name').value.trim();
  const categoryId = document.getElementById('prod-categoryId').value;
  const sku = document.getElementById('prod-sku').value.trim() || ('MKN-' + Date.now());
  const barcode = document.getElementById('prod-barcode').value.trim();
  const priceRaw = document.getElementById('prod-price').value.replace(/\D/g, '');
  const price = parseFloat(priceRaw) || 0;
  const stock = parseInt(document.getElementById('prod-stock').value);
  const photo = document.getElementById('prod-photo').value.trim();
  const status = document.getElementById('prod-status').value;
  
  showLoading();
  try {
    const payload = { id, name, categoryId, sku, barcode, price, stock, photo, status };
    const res = await api('saveProduct', payload);
    if (res.success) {
      Toast.success(res.message);
      closeProductModal();
      await loadProducts();
    }
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

async function deleteProductItem(id) {

        await loadProducts();
      }
    } catch(e) {
      console.error(e);
    } finally {
      hideLoading();
    }
  }
}

async function handleOpenShiftSubmit() {
  const val = document.getElementById('shift-open-modal').value.replace(/\D/g, '');
  const modalAwal = parseFloat(val) || 0;
  if (modalAwal < 0) return Toast.warning('Modal awal tidak boleh negatif.');
  
  showLoading();
  try {
    const res = await api('openShift', modalAwal);
    if (res.success) {
      Toast.success('Shift berhasil dibuka! Silakan mulai melayani transaksi.');
      await loadShiftPageData();
    } else {
      Toast.danger(res.message);
    }
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

async function handleCloseShiftSubmit() {
  const note = document.getElementById('shift-close-note').value.trim();
  if (confirm('Tutup shift kasir sekarang? Penjualan shift ini akan dikunci.')) {
    showLoading();
    try {
      const res = await api('closeShift', App.activeShift.id, note);
      if (res.success) {
        Toast.success('Shift kasir berhasil ditutup.');
        await loadShiftPageData();
      } else {
        Toast.danger(res.message);
      }
    } catch(e) {
      console.error(e);
    } finally {
      hideLoading();
    }
  }
}

async function loadSalesReport() {
  // Selalu ambil laporan bulan ini (hari pertama s/d hari ini)
  const now = new Date();
  const end = now.toISOString().split('T')[0];
  now.setDate(1);
  const start = now.toISOString().split('T')[0];
  
  showLoading();
  try {
    const data = await api('getReport', 'sales', start, end);
    reportData = data;
    // Simpan periode untuk keperluan export
    reportData._start = start;
    reportData._end = end;
    
    // Updates values
    document.getElementById('rep-omset-val').innerText = fmtCurrency(data.totalRevenue);
    document.getElementById('rep-volume-val').innerText = `${data.totalTx} Transaksi`;
    
    const nonCash = (data.byMethod.qris || 0) + (data.byMethod.debit || 0) + (data.byMethod.kredit || 0);
    document.getElementById('rep-nontunai-val').innerText = fmtCurrency(nonCash);
    
    const avg = data.totalTx > 0 ? Math.round(data.totalRevenue / data.totalTx) : 0;
    document.getElementById('rep-average-val').innerText = fmtCurrency(avg);
    
    // Ranking table
    const tableBody = document.getElementById('rep-products-tbody');
    if (data.topProducts && data.topProducts.length) {
      tableBody.innerHTML = data.topProducts.map(p => `
        <tr>
          <td><strong>${p.name}</strong></td>
          <td><span class="badge badge-info">${p.qty} Pcs</span></td>
          <td style="font-weight:700;">${fmtCurrency(p.revenue)}</td>
        </tr>
      `).join('');
    } else {
      tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">Tidak ada data penjualan di range ini</td></tr>`;
    }
    
    // Line Chart
    const ctx = document.getElementById('rep-sales-chart').getContext('2d');
    if (App.charts.reportLine) App.charts.reportLine.destroy();
    App.charts.reportLine = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.dailyData.map(d => {
          const date = new Date(d.date);
          return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }),
        datasets: [{
          label: 'Omset Harian (Rp)',
          data: data.dailyData.map(d => d.total),
          backgroundColor: '#6366f1',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            grid: { color: App.theme === 'dark' ? '#334155' : '#f1f5f9' },
            ticks: { color: 'var(--text-secondary)' }
          },
          x: {
            grid: { display: false },
            ticks: { color: 'var(--text-secondary)' }
          }
        }
      }
    });
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

// Client-side CSV Exporter
// Menggunakan data: URI agar bisa didownload di dalam iframe Google Apps Script
function exportReportToCSV() {
  if (!reportData || !reportData.transactions || reportData.transactions.length === 0) {
    return Toast.warning('Tidak ada data transaksi untuk diexport.');
  }
  
  const startDate = reportData._start || '-';
  const endDate = reportData._end || '-';
  const storeName = App.settings.storeName || 'Toko Saya';
  
  // Header keterangan laporan
  let csv = `LAPORAN PENJUALAN KASIR\r\n`;
  csv += `Toko:,"${storeName}"\r\n`;
  csv += `Periode:,${startDate} s/d ${endDate}\r\n`;
  csv += `Total Transaksi:,${reportData.totalTx}\r\n`;
  csv += `Total Omset Kotor:,"${fmtCurrency(reportData.totalRevenue)}"\r\n\r\n`;
  
  // Header tabel
  csv += 'Tanggal,Invoice,Metode Pembayaran,Subtotal,Diskon,Pajak,Total,Status\r\n';
  
  reportData.transactions.forEach(t => {
    csv += `"${new Date(t.createdAt).toLocaleString('id-ID')}","${t.invoice}","${(t.paymentMethod||'').toUpperCase()}",${t.subtotal||0},${t.discount||0},${t.tax||0},${t.total||0},"${t.status||''}"\r\n`;
  });
  
  // Gunakan data: URI (bukan Blob) agar download bisa berjalan di dalam iframe GAS
  const bom = '\uFEFF'; // BOM untuk Excel agar bisa baca karakter Indonesia
  const dataUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(bom + csv);
  const fileName = `Laporan_Kasir_${new Date().toISOString().split('T')[0]}.csv`;
  
  const link = document.createElement('a');
  link.setAttribute('href', dataUri);
  link.setAttribute('download', fileName);
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  
  Toast.success(`File "${fileName}" berhasil diunduh.`);
}

async function loadSettingsUsers() {
  try {
    const data = await api('getUsers');
    const tbody = document.getElementById('settings-users-tbody');
    if (!tbody) return;
    
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">Akses User Dibatasi</td></tr>`;
      return;
    }
    
    tbody.innerHTML = data.map(u => `
      <tr>
        <td><strong>${u.name}</strong></td>
        <td>${u.email}</td>
        <td>
          <span class="badge ${u.role === 'admin' ? 'badge-primary' : 'badge-info'}" style="text-transform:uppercase">
            ${u.role}
          </span>
        </td>
      </tr>
    `).join('');
  } catch(e) {
    console.error(e);
  }
}

async function handleSettingsSave(e) {
  e.preventDefault();
  
  const payload = {
    storeName: document.getElementById('set-storeName').value.trim(),
    address: document.getElementById('set-address').value.trim(),
    phone: document.getElementById('set-phone').value.trim(),
    taxRate: parseFloat(document.getElementById('set-taxRate').value) || 0,
    currencySymbol: document.getElementById('set-currencySymbol').value.trim(),
    receiptFooter: document.getElementById('set-receiptFooter').value.trim(),
  };
  
  showLoading();
  try {
    const res = await api('saveSettings', payload);
    if (res.success) {
      Toast.success('Profil toko berhasil diperbarui.');
      // Refresh local settings cache
      App.settings = { ...App.settings, ...payload };
      renderAppShell();
      navigateTo('settings');
    }
  } catch(e) {
    console.error(e);
  } finally {
    hideLoading();
  }
}

async function handleResetData() {
  if (!confirm("Apakah Anda yakin ingin menghapus seluruh riwayat transaksi, shift, dan notifikasi? Tindakan ini TIDAK dapat dibatalkan!")) {
    return;
  }
  
  showLoading();
  try {
    const res = await api('clearTransactionsAndShifts');
    Toast.success(res || 'Riwayat berhasil dikosongkan!');
    
    // Refresh state lokal
    App.activeShift = null;
    App.notifications = [];
    
    // Kembali ke dashboard untuk melihat hasilnya
    renderAppShell();
    navigateTo('dashboard');
  } catch(e) {
    console.error(e);
    Toast.error('Gagal mengosongkan riwayat data.');
  } finally {
    hideLoading();
  }
}
